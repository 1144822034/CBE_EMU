# Client physical endpoint list (host layer).
# Title-screen zone names are separate MySQL server_login_servers rows.
# Version handshake already needs one TCP endpoint before zone select.
#
# In Game Center / Android, launching 江湖OL opens a zone picker using this list.
# Skip picker with --server=NAME or --mock-service=host:port.
#
# Format: name=host:port[,account_web_url]
# Optional account_web_url is used by Android register/manage buttons.
#
# Optional list path: --server-list=path  or  CBE_SERVER_LIST=path
#
# After picking a zone, the name is sent to the service in CBMS meta so
# Jianghu OL title WT 1/1/12 shows that same name in the in-game list.

