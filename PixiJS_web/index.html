<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>江湖 OL</title>
    <style>
      :root {
        color-scheme: dark;
        --pad-bg: #0a100e;
        --pad-face: #1a2822;
        --pad-edge: #3a5a50;
        --sk-stroke: #3ddc84;
        --ink: #e8dcc8;
        --muted: #8a8070;
        --accent: #c4a35a;
        --danger: #c45c5c;
        font-family: SimSun, "Songti SC", "Microsoft YaHei", monospace;
        -webkit-tap-highlight-color: transparent;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        height: 100dvh;
        background: #05070a;
        color: var(--ink);
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
        height: 100dvh;
        padding:
          env(safe-area-inset-top, 0)
          env(safe-area-inset-right, 0)
          env(safe-area-inset-bottom, 0)
          env(safe-area-inset-left, 0);
      }
      #stage {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05070a;
      }
      /* Size set by fitPhoneWrap() to exact 240:400 — no side letterbox */
      #phone-wrap {
        position: relative;
        margin: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        background: #05070a;
        overflow: hidden;
        width: 240px;
        height: 400px;
        flex-shrink: 0;
      }
      #phone-wrap canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /*
       * L softkey | D-pad | R softkey — softkeys top-aligned with ▲ (up).
       * Touch-bar uses full stage width so R softkey isn't clipped.
       */
      #touch-bar {
        flex: 0 0 auto;
        align-self: stretch;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        display: grid;
        grid-template-columns: minmax(64px, 80px) minmax(0, 1fr) minmax(64px, 80px);
        grid-template-rows: auto auto auto;
        gap: 6px 10px;
        align-items: start;
        padding: 6px 10px calc(8px + env(safe-area-inset-bottom, 0));
        background: var(--pad-bg);
        border-top: 1px solid rgba(158, 181, 168, 0.25);
        overflow: visible;
      }
      .sk {
        appearance: none;
        border: 2px solid var(--sk-stroke);
        border-radius: 8px;
        background: var(--pad-face);
        color: #d0e8d5;
        font: inherit;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        cursor: pointer;
        touch-action: none;
        padding: 0 4px;
        line-height: 1.1;
        z-index: 2;
      }
      .sk:disabled {
        /* Fade face/text only — green stroke stays full strength */
        opacity: 1;
        color: rgba(208, 232, 213, 0.32);
        background: #121c18;
        border-color: var(--sk-stroke);
        cursor: default;
      }
      .sk:not(:disabled):active {
        background: #2a4a42;
        color: #fff;
        border-color: var(--sk-stroke);
      }
      /* Same row as D-pad; align-self:start → level with ▲ */
      #sk-left,
      #sk-right {
        width: 100%;
        height: 48px;
        font-size: 0.8rem;
        align-self: start;
      }
      #sk-left {
        grid-column: 1;
        grid-row: 2;
        justify-self: stretch;
      }
      #sk-right {
        grid-column: 3;
        grid-row: 2;
        justify-self: stretch;
      }
      #sk-center {
        grid-column: 1 / -1;
        grid-row: 1;
        justify-self: center;
        width: min(220px, 90%);
        height: 0;
        min-height: 0;
        padding: 0;
        border-width: 0;
        font-size: 0.85rem;
        overflow: hidden;
        visibility: hidden;
      }
      #sk-center.is-on {
        height: 32px;
        border-width: 2px;
        visibility: visible;
      }
      .dpad {
        grid-column: 2;
        grid-row: 2;
        display: grid;
        grid-template-columns: repeat(3, minmax(44px, 60px));
        grid-template-rows: repeat(3, 48px);
        gap: 8px;
        justify-content: center;
        justify-self: center;
        max-width: 100%;
        z-index: 1;
      }
      .dpad .pad {
        appearance: none;
        border: 2px solid var(--pad-edge);
        border-radius: 8px;
        background: var(--pad-face);
        color: #d0e8d5;
        font: inherit;
        font-size: 1.1rem;
        line-height: 1;
        padding: 0;
        cursor: pointer;
        touch-action: none;
      }
      .dpad .pad:active,
      .dpad .pad.is-down {
        background: #2a4a42;
        color: #fff;
      }
      .dpad .ok {
        font-size: 0.85rem;
        letter-spacing: 0.04em;
        color: var(--accent);
      }
      .dpad .up { grid-column: 2; grid-row: 1; }
      .dpad .left { grid-column: 1; grid-row: 2; }
      .dpad .ok { grid-column: 2; grid-row: 2; }
      .dpad .right { grid-column: 3; grid-row: 2; }
      .dpad .down { grid-column: 2; grid-row: 3; }
      #touch-status {
        grid-column: 1 / -1;
        grid-row: 3;
        min-height: 0.9em;
        font-size: 0.65rem;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: center;
        line-height: 1.1;
      }
      #touch-status.error { color: var(--danger); }
      @media (min-width: 720px) {
        #touch-bar {
          grid-template-columns: minmax(80px, 96px) minmax(0, 1fr) minmax(80px, 96px);
        }
        #sk-left,
        #sk-right {
          height: 52px;
        }
        .dpad {
          grid-template-columns: repeat(3, 72px);
          grid-template-rows: repeat(3, 52px);
          gap: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="phone-wrap"></div>
      </div>
      <div id="touch-bar">
        <button type="button" class="sk" id="sk-left" disabled>左软</button>
        <div class="dpad" aria-label="方向键">
          <button type="button" class="pad up" data-dir="up" aria-label="上">▲</button>
          <button type="button" class="pad left" data-dir="left" aria-label="左">◀</button>
          <button type="button" class="pad ok" data-action="ok" aria-label="确定">OK</button>
          <button type="button" class="pad right" data-dir="right" aria-label="右">▶</button>
          <button type="button" class="pad down" data-dir="down" aria-label="下">▼</button>
        </div>
        <button type="button" class="sk" id="sk-right" disabled>右软</button>
        <button type="button" class="sk" id="sk-center" disabled>中软</button>
        <div id="touch-status">就绪</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
