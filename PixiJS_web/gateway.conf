# PixiJS WS gateway startup config.
# Search order: PIX_GATEWAY_CONFIG, then gateway.conf next to this process
#   (PixiJS_web/gateway.conf) or scripts/gateway.conf / cwd.
# Priority: CLI argv / environment > this file > built-in defaults.
# Lines starting with # or ; are comments. key=value (first '=' splits).

# WS listen (Pixi clients connect here)
listen_host=0.0.0.0
listen_port=19092

# Upstream mock TCP (jh-online-server game port)
tcp_host=127.0.0.1
tcp_port=19090

# Upstream admin HTTP for /api/* proxy (zones, monster-levels, custom-catalog, register, …)
admin_host=127.0.0.1
admin_port=19091
